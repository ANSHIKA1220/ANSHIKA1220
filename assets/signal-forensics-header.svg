<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
  <title id="title">Anshika Shrivastava - AI Engineer</title>
  <desc id="desc">A simple dark profile banner with Anshika's name, role, location, and a subtle cyan-to-magenta signal line.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .name{font-size:38px;font-weight:650;fill:#f0f6fc;letter-spacing:-.8px}
      .role{font-size:17px;fill:#b6c2cf}
      .meta{font-size:13px;fill:#7d8996}
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="208" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="34" y="34" width="5" height="105" rx="2.5" fill="url(#accent)"/>

  <text x="66" y="79" class="name">Anshika Shrivastava</text>
  <text x="67" y="111" class="role">AI Engineer · Software Developer · VIT Bhopal ’27</text>
  <circle cx="72" cy="142" r="4" fill="#3fb950"/>
  <text x="84" y="147" class="meta">Bengaluru, India</text>

  <g transform="translate(694 66)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 44h24l11-15 14 31 18-55 18 81 18-62 17 36 17-20 17 8 17-27 18 44 17-31 16 10h26"/>
  </g>
  <circle cx="969" cy="110" r="4" fill="#e879f9"/>

  <path d="M34 177H966" stroke="#21262d"/>
  <path d="M34 177H270" stroke="url(#accent)" stroke-width="2"/>
</svg>

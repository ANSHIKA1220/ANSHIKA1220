<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="150"
  viewBox="0 0 1000 150"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    AI/ML · Software Development · VIT Bhopal '27
  </title>

  <desc id="description">
    A minimal developer profile banner with a cyan-to-magenta waveform.
  </desc>

  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#22d3ee" />
      <stop offset="1" stop-color="#e879f9" />
